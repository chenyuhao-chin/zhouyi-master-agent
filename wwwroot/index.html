<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周易 AI 大师</title>
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0d0d12;
            color: #d8d0c4;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 微妙的背景光晕 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 15% 30%, rgba(201, 169, 110, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 70%, rgba(201, 169, 110, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(120, 100, 70, 0.02) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* 太极八卦旋转背景 */
        .bg-taiji {
            position: fixed;
            top: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            opacity: 0.025;
            animation: rotate 180s linear infinite;
            z-index: 0;
            filter: blur(0.5px);
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 顶部标题栏 */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px 20px 16px;
            border-bottom: 1px solid rgba(201, 169, 110, 0.12);
        }
        .header h1 {
            font-size: 22px;
            color: #c9a96e;
            letter-spacing: 6px;
            font-weight: 500;
        }
        .header .subtitle {
            font-size: 12px;
            color: #6b6358;
            margin-top: 6px;
            letter-spacing: 3px;
        }
        
        /* 主布局 */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            height: calc(100vh - 80px);
        }
        
        /* 左侧边栏 */
        .sidebar {
            width: 240px;
            border-right: 1px solid rgba(201, 169, 110, 0.1);
            display: flex;
            flex-direction: column;
            background: rgba(13, 13, 18, 0.6);
        }
        .sidebar-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201, 169, 110, 0.08);
        }
        .sidebar-header h3 {
            font-size: 13px;
            color: #c9a96e;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .btn-new-session {
            background: rgba(201, 169, 110, 0.1);
            border: 1px solid rgba(201, 169, 110, 0.2);
            color: #c9a96e;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-new-session:hover {
            background: rgba(201, 169, 110, 0.18);
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
            display: flex;
            align-items: center;
        }
        .session-item:hover {
            background: rgba(201, 169, 110, 0.06);
        }
        .session-item.active {
            background: rgba(201, 169, 110, 0.1);
            border-color: rgba(201, 169, 110, 0.2);
        }
        .session-item .session-info {
            flex: 1;
            min-width: 0;
        }
        .session-item .title {
            font-size: 13px;
            color: #d8d0c4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item .time {
            font-size: 11px;
            color: #5a5550;
            margin-top: 3px;
        }
        .session-item .btn-delete {
            display: none;
            background: none;
            border: none;
            color: #8b6b6b;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 3px;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 4px;
        }
        .session-item:hover .btn-delete {
            display: block;
        }
        .session-item .btn-delete:hover {
            background: rgba(200, 80, 80, 0.15);
            color: #c06060;
        }
        
        /* 右侧主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* 模式切换 */
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(201, 169, 110, 0.08);
        }
        .btn-mode {
            background: rgba(201, 169, 110, 0.06);
            border: 1px solid rgba(201, 169, 110, 0.15);
            color: #7a7268;
            padding: 7px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .btn-mode:hover {
            background: rgba(201, 169, 110, 0.1);
            color: #c9a96e;
        }
        .btn-mode.active {
            background: rgba(201, 169, 110, 0.12);
            border-color: rgba(201, 169, 110, 0.35);
            color: #c9a96e;
        }
        
        /* 六爻排盘表 */
        .liuyao-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        .liuyao-table th {
            background: rgba(201, 169, 110, 0.08);
            color: #c9a96e;
            padding: 6px;
            border: 1px solid rgba(201, 169, 110, 0.1);
            font-weight: 400;
        }
        .liuyao-table td {
            padding: 6px;
            border: 1px solid rgba(201, 169, 110, 0.08);
            text-align: center;
            color: #d8d0c4;
        }
        .liuyao-table tr.dong-yao {
            background: rgba(201, 169, 110, 0.06);
        }
        .liuyao-table .shi-ying {
            color: #c9a96e;
            font-weight: 600;
        }
        .liuyao-table .liushen-cell {
            color: #7a7268;
        }
        
        /* 卦象展示区 */
        .gua-display {
            display: none;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(201, 169, 110, 0.1);
            background: rgba(201, 169, 110, 0.02);
        }
        .gua-display.show { display: block; }
        .gua-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .gua-symbol {
            font-size: 42px;
            color: #c9a96e;
            min-width: 50px;
            text-align: center;
        }
        .gua-info { flex: 1; }
        .gua-name {
            font-size: 17px;
            color: #c9a96e;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .gua-detail {
            font-size: 12px;
            color: #7a7268;
            line-height: 1.8;
        }
        .gua-detail span {
            color: #d8d0c4;
        }
        
        /* 对话消息区 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .message.assistant .avatar { background: rgba(201, 169, 110, 0.12); }
        .message.user .avatar { background: rgba(100, 140, 220, 0.12); }
        .msg-content {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.75;
            word-break: break-word;
        }
        .message.assistant .msg-content {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top-left-radius: 3px;
            color: #d8d0c4;
        }
        .message.user .msg-content {
            background: rgba(100, 140, 220, 0.1);
            border: 1px solid rgba(100, 140, 220, 0.15);
            border-top-right-radius: 3px;
            color: #b8c8e8;
        }
        
        /* Markdown 渲染样式 */
        .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
            color: #c9a96e;
            margin: 12px 0 6px 0;
            font-weight: 500;
        }
        .msg-content h1 { font-size: 17px; }
        .msg-content h2 { font-size: 15px; }
        .msg-content h3 { font-size: 14px; }
        .msg-content h4 { font-size: 13px; }
        .msg-content h1:first-child, .msg-content h2:first-child, .msg-content h3:first-child {
            margin-top: 0;
        }
        .msg-content p {
            margin: 6px 0;
        }
        .msg-content ul, .msg-content ol {
            margin: 6px 0;
            padding-left: 20px;
        }
        .msg-content li {
            margin: 3px 0;
        }
        .msg-content strong {
            color: #e8dcc8;
            font-weight: 600;
        }
        .msg-content em {
            color: #b8a888;
        }
        .msg-content code {
            background: rgba(201, 169, 110, 0.1);
            color: #c9a96e;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .msg-content pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
        }
        .msg-content pre code {
            background: none;
            padding: 0;
            color: #d8d0c4;
        }
        .msg-content blockquote {
            border-left: 3px solid rgba(201, 169, 110, 0.3);
            padding-left: 12px;
            margin: 8px 0;
            color: #9a9288;
        }
        .msg-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 13px;
        }
        .msg-content table th {
            background: rgba(201, 169, 110, 0.08);
            color: #c9a96e;
            padding: 6px 8px;
            border: 1px solid rgba(201, 169, 110, 0.1);
            text-align: left;
        }
        .msg-content table td {
            padding: 6px 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .msg-content hr {
            border: none;
            border-top: 1px solid rgba(201, 169, 110, 0.15);
            margin: 12px 0;
        }
        
        /* 输入区 */
        .input-area {
            padding: 14px 20px;
            border-top: 1px solid rgba(201, 169, 110, 0.1);
            background: rgba(13, 13, 18, 0.7);
        }
        .divination-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-divine {
            background: rgba(201, 169, 110, 0.1);
            border: 1px solid rgba(201, 169, 110, 0.25);
            color: #c9a96e;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-divine:hover {
            background: rgba(201, 169, 110, 0.18);
        }
        .btn-divine:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .number-inputs {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .number-inputs input {
            width: 55px;
            background: rgba(201, 169, 110, 0.06);
            border: 1px solid rgba(201, 169, 110, 0.18);
            color: #d8d0c4;
            padding: 7px 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            font-family: inherit;
        }
        .number-inputs input:focus {
            outline: none;
            border-color: rgba(201, 169, 110, 0.4);
        }
        .number-inputs span {
            color: #5a5550;
            font-size: 11px;
        }
        
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d8d0c4;
            padding: 10px 14px;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            min-height: 42px;
            max-height: 120px;
            transition: border-color 0.2s;
        }
        .input-row textarea:focus {
            outline: none;
            border-color: rgba(201, 169, 110, 0.3);
        }
        .input-row textarea::placeholder {
            color: #4a4840;
        }
        .btn-send {
            background: rgba(201, 169, 110, 0.15);
            border: 1px solid rgba(201, 169, 110, 0.3);
            color: #c9a96e;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            align-self: flex-end;
        }
        .btn-send:hover {
            background: rgba(201, 169, 110, 0.22);
        }
        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            border-top-left-radius: 3px;
            margin-bottom: 16px;
            max-width: 70%;
        }
        .loading.show { display: block; }
        .loading-dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c9a96e;
            margin: 0 3px;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40% { transform: translateY(-8px); opacity: 1; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201, 169, 110, 0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(201, 169, 110, 0.25); }
        
        /* 欢迎消息 */
        .welcome {
            text-align: center;
            padding: 50px 20px;
        }
        .welcome .taiji-symbol {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .welcome h2 {
            font-size: 20px;
            color: #c9a96e;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .welcome p {
            color: #6b6358;
            font-size: 14px;
            line-height: 1.9;
        }
        .welcome .tip {
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(201, 169, 110, 0.04);
            border: 1px solid rgba(201, 169, 110, 0.08);
            border-radius: 8px;
            display: inline-block;
        }
        .welcome .tip span {
            color: #c9a96e;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 180px; border-right: none; border-bottom: 1px solid rgba(201, 169, 110, 0.1); }
            .header h1 { font-size: 18px; letter-spacing: 3px; }
            .msg-content { max-width: 85%; }
            .gua-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<!-- 太极背景 -->
<svg class="bg-taiji" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="98" fill="none" stroke="#c9a96e" stroke-width="1"/>
    <path d="M100,2 A98,98 0 0,1 100,198 A49,49 0 0,1 100,100 A49,49 0 0,0 100,2" fill="#c9a96e" opacity="0.2"/>
    <circle cx="100" cy="50" r="10" fill="#0d0d12"/>
    <circle cx="100" cy="150" r="10" fill="#c9a96e" opacity="0.2"/>
</svg>

<div class="header">
    <h1>周易 AI 大师</h1>
    <div class="subtitle">以易理为本 · 以AI为用 · 梅花易数 · 六爻预测</div>
</div>

<div class="container">
    <!-- 左侧会话列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>卜卦记录</h3>
            <button class="btn-new-session" onclick="newSession()">+ 新卦</button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>
    
    <!-- 右侧主区域 -->
    <div class="main">
        <!-- 卦象展示区 -->
        <div class="gua-display" id="guaDisplay">
            <div class="gua-header">
                <div class="gua-symbol" id="guaSymbol">☰</div>
                <div class="gua-info">
                    <div class="gua-name" id="guaName">-</div>
                    <div class="gua-detail" id="guaDetail"></div>
                </div>
            </div>
        </div>
        
        <!-- 模式切换 -->
        <div class="mode-switch">
            <button class="btn-mode active" id="modeMeihua" onclick="switchMode('meihua')">☰ 梅花易数</button>
            <button class="btn-mode" id="modeLiuyao" onclick="switchMode('liuyao')">☷ 六爻预测</button>
        </div>
        
        <!-- 消息区 -->
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="taiji-symbol">☯</div>
                <h2>欢迎来到梅花易数</h2>
                <p>梅花易数，由宋代邵雍所创，以万物皆可起卦闻名<br>
                心中默念所问之事，随心取数，即刻解卦</p>
                <div class="tip">
                    <span>提示</span>：选择下方起卦方式，或直接输入问题开始对话
                </div>
            </div>
        </div>
        
        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        
        <!-- 输入区 -->
        <div class="input-area">
            <div class="divination-controls">
                <div id="meihuaControls">
                    <button class="btn-divine" onclick="divine('random')">🎲 随机起卦</button>
                    <button class="btn-divine" onclick="divine('time')">⏰ 时间起卦</button>
                    <div class="number-inputs">
                        <input type="number" id="num1" placeholder="数1" min="1">
                        <span>·</span>
                        <input type="number" id="num2" placeholder="数2" min="1">
                        <span>·</span>
                        <input type="number" id="num3" placeholder="数3(可选)" min="0">
                        <button class="btn-divine" onclick="divine('number')">📐 数字起卦</button>
                    </div>
                </div>
                <div id="liuyaoControls" style="display:none">
                    <button class="btn-divine" onclick="divineLiuyao()">🔮 铜钱摇卦（随机排盘）</button>
                </div>
            </div>
            <div class="input-row">
                <textarea id="inputBox" rows="2" placeholder="输入你想问的问题，或继续追问..." onkeydown="handleKey(event)"></textarea>
                <button class="btn-send" onclick="sendMessage()" id="btnSend">问卦</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentSessionId = null;
let isLoading = false;
let currentMode = 'meihua';

// 配置 marked.js
if (typeof marked !== 'undefined') {
    marked.setOptions({
        breaks: true,
        gfm: true
    });
}

// 加载会话列表
async function loadSessions() {
    try {
        const resp = await fetch('/api/sessions');
        const data = await resp.json();
        const list = document.getElementById('sessionList');
        list.innerHTML = '';
        
        if (!data.sessions || data.sessions.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#4a4840;font-size:13px;">暂无记录</div>';
            return;
        }
        
        data.sessions.forEach(s => {
            const div = document.createElement('div');
            div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
            const date = new Date(s.updated_at * 1000);
            const timeStr = (date.getMonth()+1) + '/' + date.getDate() + ' ' + 
                           date.getHours().toString().padStart(2,'0') + ':' + 
                           date.getMinutes().toString().padStart(2,'0');
            div.innerHTML = `
                <div class="session-info" onclick="loadSession('${s.id}')">
                    <div class="title">${s.title || '梅花易数'}</div>
                    <div class="time">${timeStr}</div>
                </div>
                <button class="btn-delete" onclick="event.stopPropagation();deleteSession('${s.id}')" title="删除此记录">🗑</button>`;
            list.appendChild(div);
        });
    } catch(e) {
        console.error('Failed to load sessions:', e);
    }
}

// 删除会话
async function deleteSession(sessionId) {
    if (!confirm('确定要删除这条卜卦记录吗？')) return;
    
    try {
        const resp = await fetch('/api/sessions/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId })
        });
        const data = await resp.json();
        
        if (data.success) {
            if (currentSessionId === sessionId) {
                newSession();
            }
            loadSessions();
        }
    } catch(e) {
        console.error('Failed to delete session:', e);
    }
}

// 切换模式
function switchMode(mode) {
    currentMode = mode;
    document.getElementById('modeMeihua').classList.toggle('active', mode === 'meihua');
    document.getElementById('modeLiuyao').classList.toggle('active', mode === 'liuyao');
    document.getElementById('meihuaControls').style.display = mode === 'meihua' ? '' : 'none';
    document.getElementById('liuyaoControls').style.display = mode === 'liuyao' ? '' : 'none';
    
    if (!currentSessionId) {
        const welcome = document.querySelector('.welcome');
        if (welcome) {
            if (mode === 'meihua') {
                welcome.querySelector('h2').textContent = '欢迎来到梅花易数';
                welcome.querySelector('p').innerHTML = '梅花易数，由宋代邵雍所创，以万物皆可起卦闻名<br>心中默念所问之事，随心取数，即刻解卦';
            } else {
                welcome.querySelector('h2').textContent = '欢迎来到六爻预测';
                welcome.querySelector('p').innerHTML = '六爻预测，以铜钱摇卦为基础，结合纳甲六亲断卦<br>心中默念所问之事，随机排盘，专业解读';
            }
        }
    }
}

// 新建会话
function newSession() {
    currentSessionId = null;
    document.getElementById('messages').innerHTML = `
        <div class="welcome">
            <div class="taiji-symbol">☯</div>
            <h2>新的一卦</h2>
            <p>心中默念所问之事<br>选择起卦方式开始</p>
        </div>`;
    document.getElementById('guaDisplay').classList.remove('show');
    document.getElementById('inputBox').value = '';
    loadSessions();
}

// 加载已有会话
async function loadSession(sessionId) {
    currentSessionId = sessionId;
    document.getElementById('messages').innerHTML = '';
    
    try {
        const resp = await fetch('/api/messages?session_id=' + sessionId);
        const data = await resp.json();
        
        if (data.messages) {
            let lastGua = null;
            data.messages.forEach(m => {
                addMessage(m.role, m.content);
                if (m.role === 'assistant' && m.gua_json) {
                    try { lastGua = JSON.parse(m.gua_json); } catch(e) {}
                }
            });
            if (lastGua) showGua(lastGua);
        }
    } catch(e) {
        console.error('Failed to load messages:', e);
    }
    
    loadSessions();
}

// 显示卦象
function showGua(gua) {
    const display = document.getElementById('guaDisplay');
    display.classList.add('show');
    
    document.getElementById('guaSymbol').textContent = gua.ben_gua_symbol || '☰';
    document.getElementById('guaName').textContent = 
        (gua.ben_gua_name || '') + '之' + (gua.bian_gua_name || '');
    
    let detail = '';
    detail += `<div>本卦：<span>${gua.ben_gua_name}（${gua.ben_gua_upper}/${gua.ben_gua_lower}）</span></div>`;
    detail += `<div>互卦：<span>${gua.hu_gua_name || '-'}</span></div>`;
    detail += `<div>变卦：<span>${gua.bian_gua_name}（变爻第${gua.bian_yao}爻）</span></div>`;
    detail += `<div>五行：<span>体-${gua.ti_element || '-'} 用-${gua.yong_element || '-'}</span>　关系：<span>${gua.ti_yong_relation || '-'}</span></div>`;
    
    document.getElementById('guaDetail').innerHTML = detail;
}

// 添加消息（支持 Markdown 渲染）
function addMessage(role, content) {
    const messages = document.getElementById('messages');
    const welcome = messages.querySelector('.welcome');
    if (welcome) welcome.remove();
    
    const div = document.createElement('div');
    div.className = 'message ' + role;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '☯' : '问';
    
    const msgContent = document.createElement('div');
    msgContent.className = 'msg-content';
    
    if (role === 'assistant' && typeof marked !== 'undefined') {
        // 使用 marked 渲染 Markdown
        try {
            msgContent.innerHTML = marked.parse(content);
        } catch(e) {
            msgContent.textContent = content;
        }
    } else {
        // 用户消息保持纯文本
        msgContent.textContent = content;
    }
    
    div.appendChild(avatar);
    div.appendChild(msgContent);
    messages.appendChild(div);
    
    messages.scrollTop = messages.scrollHeight;
}

// 设置加载状态
function setLoading(loading) {
    isLoading = loading;
    document.getElementById('loading').classList.toggle('show', loading);
    document.getElementById('btnSend').disabled = loading;
    document.querySelectorAll('.btn-divine').forEach(b => b.disabled = loading);
}

// 起卦
async function divine(mode) {
    if (isLoading) return;
    
    const question = document.getElementById('inputBox').value.trim();
    
    if (mode === 'number') {
        const n1 = parseInt(document.getElementById('num1').value);
        const n2 = parseInt(document.getElementById('num2').value);
        if (!n1 || !n2 || n1 <= 0 || n2 <= 0) {
            alert('请输入至少两个正整数');
            return;
        }
    }
    
    if (question) {
        addMessage('user', question);
    } else {
        const modeNames = { 'random': '随机起卦', 'time': '时间起卦', 'number': '数字起卦' };
        addMessage('user', `[${modeNames[mode]}]`);
    }
    
    setLoading(true);
    document.getElementById('inputBox').value = '';
    
    try {
        const body = {
            mode: mode,
            question: question || '请为我解卦',
            session_id: currentSessionId || ''
        };
        
        if (mode === 'number') {
            body.num1 = parseInt(document.getElementById('num1').value);
            body.num2 = parseInt(document.getElementById('num2').value);
            const n3 = parseInt(document.getElementById('num3').value);
            if (n3 > 0) body.num3 = n3;
        }
        
        const resp = await fetch('/api/divination', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            currentSessionId = data.session_id;
            if (data.gua) showGua(data.gua);
            if (data.reply) addMessage('assistant', data.reply);
            loadSessions();
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
        console.error(e);
    }
    
    setLoading(false);
}

// 六爻起卦
async function divineLiuyao() {
    if (isLoading) return;
    
    const question = document.getElementById('inputBox').value.trim();
    
    if (question) {
        addMessage('user', '【六爻预测】' + question);
    } else {
        addMessage('user', '【六爻预测】铜钱摇卦');
    }
    
    setLoading(true);
    document.getElementById('inputBox').value = '';
    
    try {
        const body = {
            mode: 'random',
            question: question || '请为我断卦',
            session_id: currentSessionId || ''
        };
        
        const resp = await fetch('/api/liuyao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            currentSessionId = data.session_id;
            if (data.gua) showLiuyaoGua(data.gua);
            if (data.reply) addMessage('assistant', data.reply);
            loadSessions();
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
        console.error(e);
    }
    
    setLoading(false);
}

// 显示六爻卦象
function showLiuyaoGua(gua) {
    const display = document.getElementById('guaDisplay');
    display.classList.add('show');
    
    document.getElementById('guaSymbol').textContent = '☷';
    document.getElementById('guaName').textContent = 
        (gua.ben_gua_name || '') + ' 之 ' + (gua.bian_gua_name || '');
    
    let detail = '';
    detail += `<div>所属宫：<span>${gua.gong_name || '-'}（${gua.gong_wuxing || '-'}）</span></div>`;
    detail += `<div>起卦时间：<span>${gua.gua_time || '-'}</span></div>`;
    detail += `<div>干支：<span>${gua.ganzhi_year || ''}年 ${gua.ganzhi_month || ''}月 ${gua.ganzhi_day || ''}日 ${gua.ganzhi_hour || ''}时</span></div>`;
    
    if (gua.yao && gua.yao.length === 6) {
        const posNames = ['上爻','五爻','四爻','三爻','二爻','初爻'];
        detail += `<table class="liuyao-table"><tr><th>爻位</th><th>六亲</th><th>卦</th><th>六神</th><th>世应</th></tr>`;
        for (let i = 5; i >= 0; i--) {
            const y = gua.yao[i];
            const dongMark = y.is_dong ? ' ○' : '';
            const shiYing = y.is_shi ? '<span class="shi-ying">世</span>' : (y.is_ying ? '<span class="shi-ying">应</span>' : '');
            const yy = y.yinyang ? '———' : '— —';
            detail += `<tr class="${y.is_dong ? 'dong-yao' : ''}">`;
            detail += `<td>${posNames[i]}</td>`;
            detail += `<td>${y.liuqin || '-'}</td>`;
            detail += `<td>${y.dizhi || ''} ${y.wuxing || ''} ${yy}${dongMark}</td>`;
            detail += `<td class="liushen-cell">${y.liushen || '-'}</td>`;
            detail += `<td>${shiYing}</td>`;
            detail += `</tr>`;
        }
        detail += `</table>`;
    }
    
    document.getElementById('guaDetail').innerHTML = detail;
}

// 发送追问消息
async function sendMessage() {
    if (isLoading) return;
    
    const input = document.getElementById('inputBox');
    const message = input.value.trim();
    if (!message) return;
    
    if (!currentSessionId) {
        divine('random');
        return;
    }
    
    addMessage('user', message);
    input.value = '';
    setLoading(true);
    
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: currentSessionId,
                message: message
            })
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else if (data.reply) {
            addMessage('assistant', data.reply);
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
    }
    
    setLoading(false);
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (currentSessionId) {
            sendMessage();
        } else {
            divine('random');
        }
    }
}

document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

loadSessions();
</script>
