<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周易 AI 大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            background: #0a0a0f;
            color: #d4c5a9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(139, 69, 19, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(184, 134, 11, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(139, 90, 43, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* 太极八卦旋转背景 */
        .bg-taiji {
            position: fixed;
            top: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            opacity: 0.03;
            animation: rotate 120s linear infinite;
            z-index: 0;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 顶部标题栏 */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid rgba(184, 134, 11, 0.2);
        }
        .header h1 {
            font-size: 28px;
            color: #b8860b;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
            font-weight: 400;
        }
        .header .subtitle {
            font-size: 13px;
            color: #8b7355;
            margin-top: 8px;
            letter-spacing: 4px;
        }
        
        /* 主布局 */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            height: calc(100vh - 100px);
        }
        
        /* 左侧边栏 */
        .sidebar {
            width: 260px;
            border-right: 1px solid rgba(184, 134, 11, 0.15);
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.5);
        }
        .sidebar-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(184, 134, 11, 0.1);
        }
        .sidebar-header h3 {
            font-size: 14px;
            color: #b8860b;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .btn-new-session {
            background: rgba(184, 134, 11, 0.15);
            border: 1px solid rgba(184, 134, 11, 0.3);
            color: #b8860b;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-new-session:hover {
            background: rgba(184, 134, 11, 0.25);
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .session-item {
            padding: 12px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .session-item:hover {
            background: rgba(184, 134, 11, 0.08);
        }
        .session-item.active {
            background: rgba(184, 134, 11, 0.12);
            border-color: rgba(184, 134, 11, 0.3);
        }
        .session-item .title {
            font-size: 13px;
            color: #d4c5a9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item .time {
            font-size: 11px;
            color: #6b5d4d;
            margin-top: 4px;
        }
        
        /* 右侧主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* 模式切换 */
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(184, 134, 11, 0.1);
        }
        .btn-mode {
            background: rgba(184, 134, 11, 0.08);
            border: 1px solid rgba(184, 134, 11, 0.2);
            color: #8b7355;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .btn-mode:hover {
            background: rgba(184, 134, 11, 0.15);
            color: #b8860b;
        }
        .btn-mode.active {
            background: rgba(184, 134, 11, 0.2);
            border-color: rgba(184, 134, 11, 0.5);
            color: #b8860b;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.15);
        }
        
        /* 六爻排盘表 */
        .liuyao-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        .liuyao-table th {
            background: rgba(184, 134, 11, 0.1);
            color: #b8860b;
            padding: 8px 6px;
            border: 1px solid rgba(184, 134, 11, 0.15);
            font-weight: 400;
            letter-spacing: 1px;
        }
        .liuyao-table td {
            padding: 8px 6px;
            border: 1px solid rgba(184, 134, 11, 0.1);
            text-align: center;
            color: #d4c5a9;
        }
        .liuyao-table tr.dong-yao {
            background: rgba(184, 134, 11, 0.08);
        }
        .liuyao-table .shi-ying {
            color: #b8860b;
            font-weight: bold;
        }
        .liuyao-table .liushen-cell {
            color: #8b7355;
        }
        
        /* 卦象展示区 */
        .gua-display {
            display: none;
            padding: 20px;
            border-bottom: 1px solid rgba(184, 134, 11, 0.15);
            background: rgba(184, 134, 11, 0.03);
        }
        .gua-display.show { display: block; }
        .gua-header {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .gua-symbol {
            font-size: 48px;
            color: #b8860b;
            text-shadow: 0 0 30px rgba(184, 134, 11, 0.4);
            min-width: 60px;
            text-align: center;
        }
        .gua-info { flex: 1; }
        .gua-name {
            font-size: 20px;
            color: #b8860b;
            margin-bottom: 6px;
        }
        .gua-detail {
            font-size: 13px;
            color: #8b7355;
            line-height: 1.8;
        }
        .gua-detail span {
            color: #d4c5a9;
        }
        
        /* 对话消息区 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.assistant .avatar { background: rgba(184, 134, 11, 0.2); }
        .message.user .avatar { background: rgba(100, 149, 237, 0.2); }
        .msg-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.assistant .msg-content {
            background: rgba(184, 134, 11, 0.08);
            border: 1px solid rgba(184, 134, 11, 0.15);
            border-top-left-radius: 4px;
        }
        .message.user .msg-content {
            background: rgba(100, 149, 237, 0.12);
            border: 1px solid rgba(100, 149, 237, 0.2);
            border-top-right-radius: 4px;
        }
        
        /* 输入区 */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(184, 134, 11, 0.15);
            background: rgba(10, 10, 15, 0.8);
        }
        .divination-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-divine {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.3), rgba(184, 134, 11, 0.15));
            border: 1px solid rgba(184, 134, 11, 0.4);
            color: #b8860b;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .btn-divine:hover {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.4), rgba(184, 134, 11, 0.25));
            transform: translateY(-1px);
        }
        .btn-divine:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .number-inputs {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .number-inputs input {
            width: 60px;
            background: rgba(184, 134, 11, 0.08);
            border: 1px solid rgba(184, 134, 11, 0.25);
            color: #d4c5a9;
            padding: 8px 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            font-family: inherit;
        }
        .number-inputs input:focus {
            outline: none;
            border-color: rgba(184, 134, 11, 0.5);
        }
        .number-inputs span {
            color: #6b5d4d;
            font-size: 12px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row textarea {
            flex: 1;
            background: rgba(184, 134, 11, 0.05);
            border: 1px solid rgba(184, 134, 11, 0.2);
            color: #d4c5a9;
            padding: 12px 16px;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            min-height: 48px;
            max-height: 120px;
        }
        .input-row textarea:focus {
            outline: none;
            border-color: rgba(184, 134, 11, 0.4);
        }
        .input-row textarea::placeholder {
            color: #5a4d3d;
        }
        .btn-send {
            background: rgba(184, 134, 11, 0.25);
            border: 1px solid rgba(184, 134, 11, 0.4);
            color: #b8860b;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            align-self: flex-end;
        }
        .btn-send:hover {
            background: rgba(184, 134, 11, 0.35);
        }
        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            padding: 14px 18px;
            background: rgba(184, 134, 11, 0.08);
            border: 1px solid rgba(184, 134, 11, 0.15);
            border-radius: 12px;
            border-top-left-radius: 4px;
            margin-bottom: 20px;
            max-width: 70%;
        }
        .loading.show { display: block; }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b8860b;
            margin: 0 3px;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-10px); opacity: 1; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(184, 134, 11, 0.3); }
        
        /* 欢迎消息 */
        .welcome {
            text-align: center;
            padding: 60px 20px;
        }
        .welcome .taiji-symbol {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        .welcome h2 {
            font-size: 22px;
            color: #b8860b;
            font-weight: 400;
            letter-spacing: 6px;
            margin-bottom: 12px;
        }
        .welcome p {
            color: #6b5d4d;
            font-size: 14px;
            line-height: 2;
        }
        .welcome .tip {
            margin-top: 24px;
            padding: 16px;
            background: rgba(184, 134, 11, 0.05);
            border: 1px solid rgba(184, 134, 11, 0.1);
            border-radius: 8px;
            display: inline-block;
        }
        .welcome .tip span {
            color: #b8860b;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(184, 134, 11, 0.15); }
            .header h1 { font-size: 22px; letter-spacing: 4px; }
            .msg-content { max-width: 85%; }
            .gua-header { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<!-- 太极背景 -->
<svg class="bg-taiji" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="98" fill="none" stroke="#b8860b" stroke-width="2"/>
    <path d="M100,2 A98,98 0 0,1 100,198 A49,49 0 0,1 100,100 A49,49 0 0,0 100,2" fill="#b8860b" opacity="0.3"/>
    <circle cx="100" cy="50" r="12" fill="#0a0a0f"/>
    <circle cx="100" cy="150" r="12" fill="#b8860b" opacity="0.3"/>
</svg>

<div class="header">
    <h1>周易 AI 大师</h1>
    <div class="subtitle">以易理为本 · 以AI为用 · 梅花易数 · 六爻预测</div>
</div>

<div class="container">
    <!-- 左侧会话列表 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>卜卦记录</h3>
            <button class="btn-new-session" onclick="newSession()">+ 新卦</button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>
    
    <!-- 右侧主区域 -->
    <div class="main">
        <!-- 卦象展示区 -->
        <div class="gua-display" id="guaDisplay">
            <div class="gua-header">
                <div class="gua-symbol" id="guaSymbol">☰</div>
                <div class="gua-info">
                    <div class="gua-name" id="guaName">-</div>
                    <div class="gua-detail" id="guaDetail"></div>
                </div>
            </div>
        </div>
        
        <!-- 模式切换 -->
        <div class="mode-switch">
            <button class="btn-mode active" id="modeMeihua" onclick="switchMode('meihua')">☰ 梅花易数</button>
            <button class="btn-mode" id="modeLiuyao" onclick="switchMode('liuyao')">☷ 六爻预测</button>
        </div>
        
        <!-- 消息区 -->
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="taiji-symbol">☯</div>
                <h2>欢迎来到梅花易数</h2>
                <p>梅花易数，由宋代邵雍所创，以万物皆可起卦闻名<br>
                心中默念所问之事，随心取数，即刻解卦</p>
                <div class="tip">
                    <span>提示</span>：选择下方起卦方式，或直接输入问题开始对话
                </div>
            </div>
        </div>
        
        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        
        <!-- 输入区 -->
        <div class="input-area">
            <div class="divination-controls">
                <div id="meihuaControls">
                    <button class="btn-divine" onclick="divine('random')">🎲 随机起卦</button>
                    <button class="btn-divine" onclick="divine('time')">⏰ 时间起卦</button>
                    <div class="number-inputs">
                        <input type="number" id="num1" placeholder="数1" min="1">
                        <span>·</span>
                        <input type="number" id="num2" placeholder="数2" min="1">
                        <span>·</span>
                        <input type="number" id="num3" placeholder="数3(可选)" min="0">
                        <button class="btn-divine" onclick="divine('number')">📐 数字起卦</button>
                    </div>
                </div>
                <div id="liuyaoControls" style="display:none">
                    <button class="btn-divine" onclick="divineLiuyao()">🔮 铜钱摇卦（随机排盘）</button>
                </div>
            </div>
            <div class="input-row">
                <textarea id="inputBox" rows="2" placeholder="输入你想问的问题，或继续追问..." onkeydown="handleKey(event)"></textarea>
                <button class="btn-send" onclick="sendMessage()" id="btnSend">问卦</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentSessionId = null;
let isLoading = false;
let currentMode = 'meihua'; // 'meihua' or 'liuyao'

// 加载会话列表
async function loadSessions() {
    try {
        const resp = await fetch('/api/sessions');
        const data = await resp.json();
        const list = document.getElementById('sessionList');
        list.innerHTML = '';
        
        if (!data.sessions || data.sessions.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#5a4d3d;font-size:13px;">暂无记录</div>';
            return;
        }
        
        data.sessions.forEach(s => {
            const div = document.createElement('div');
            div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
            const date = new Date(s.updated_at * 1000);
            const timeStr = (date.getMonth()+1) + '/' + date.getDate() + ' ' + 
                           date.getHours().toString().padStart(2,'0') + ':' + 
                           date.getMinutes().toString().padStart(2,'0');
            div.innerHTML = `<div class="title">${s.title || '梅花易数'}</div><div class="time">${timeStr}</div>`;
            div.onclick = () => loadSession(s.id);
            list.appendChild(div);
        });
    } catch(e) {
        console.error('Failed to load sessions:', e);
    }
}

// 切换模式
function switchMode(mode) {
    currentMode = mode;
    document.getElementById('modeMeihua').classList.toggle('active', mode === 'meihua');
    document.getElementById('modeLiuyao').classList.toggle('active', mode === 'liuyao');
    document.getElementById('meihuaControls').style.display = mode === 'meihua' ? '' : 'none';
    document.getElementById('liuyaoControls').style.display = mode === 'liuyao' ? '' : 'none';
    
    // 更新欢迎页
    if (!currentSessionId) {
        const welcome = document.querySelector('.welcome');
        if (welcome) {
            if (mode === 'meihua') {
                welcome.querySelector('h2').textContent = '欢迎来到梅花易数';
                welcome.querySelector('p').innerHTML = '梅花易数，由宋代邵雍所创，以万物皆可起卦闻名<br>心中默念所问之事，随心取数，即刻解卦';
            } else {
                welcome.querySelector('h2').textContent = '欢迎来到六爻预测';
                welcome.querySelector('p').innerHTML = '六爻预测，以铜钱摇卦为基础，结合纳甲六亲断卦<br>心中默念所问之事，随机排盘，专业解读';
            }
        }
    }
}

// 新建会话
function newSession() {
    currentSessionId = null;
    document.getElementById('messages').innerHTML = `
        <div class="welcome">
            <div class="taiji-symbol">☯</div>
            <h2>新的一卦</h2>
            <p>心中默念所问之事<br>选择起卦方式开始</p>
        </div>`;
    document.getElementById('guaDisplay').classList.remove('show');
    document.getElementById('inputBox').value = '';
    loadSessions();
}

// 加载已有会话
async function loadSession(sessionId) {
    currentSessionId = sessionId;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('welcome')?.remove();
    
    try {
        const resp = await fetch('/api/messages?session_id=' + sessionId);
        const data = await resp.json();
        
        if (data.messages) {
            // 找到最后一个有gua_json的assistant消息来显示卦象
            let lastGua = null;
            data.messages.forEach(m => {
                addMessage(m.role, m.content);
                if (m.role === 'assistant' && m.gua_json) {
                    try { lastGua = JSON.parse(m.gua_json); } catch(e) {}
                }
            });
            if (lastGua) showGua(lastGua);
        }
    } catch(e) {
        console.error('Failed to load messages:', e);
    }
    
    loadSessions();
}

// 显示卦象
function showGua(gua) {
    const display = document.getElementById('guaDisplay');
    display.classList.add('show');
    
    document.getElementById('guaSymbol').textContent = gua.ben_gua_symbol || '☰';
    document.getElementById('guaName').textContent = 
        (gua.ben_gua_name || '') + '之' + (gua.bian_gua_name || '');
    
    const elements = ['金', '木', '水', '火', '土'];
    const wuxingNames = { '乾': '金', '兑': '金', '离': '火', '震': '木', '巽': '木', '坎': '水', '艮': '土', '坤': '土' };
    
    let detail = '';
    detail += `<div>本卦：<span>${gua.ben_gua_name}（${gua.ben_gua_upper}/${gua.ben_gua_lower}）</span></div>`;
    detail += `<div>互卦：<span>${gua.hu_gua_name || '-'}</span></div>`;
    detail += `<div>变卦：<span>${gua.bian_gua_name}（变爻第${gua.bian_yao}爻）</span></div>`;
    detail += `<div>五行：<span>体-${gua.ti_element || '-'} 用-${gua.yong_element || '-'}</span>　关系：<span>${gua.ti_yong_relation || '-'}</span></div>`;
    
    document.getElementById('guaDetail').innerHTML = detail;
}

// 添加消息
function addMessage(role, content) {
    const messages = document.getElementById('messages');
    // 移除欢迎页面
    const welcome = messages.querySelector('.welcome');
    if (welcome) welcome.remove();
    
    const div = document.createElement('div');
    div.className = 'message ' + role;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'assistant' ? '☯' : '问';
    
    const msgContent = document.createElement('div');
    msgContent.className = 'msg-content';
    msgContent.textContent = content;
    
    div.appendChild(avatar);
    div.appendChild(msgContent);
    messages.appendChild(div);
    
    // 滚动到底部
    messages.scrollTop = messages.scrollHeight;
}

// 设置加载状态
function setLoading(loading) {
    isLoading = loading;
    document.getElementById('loading').classList.toggle('show', loading);
    document.getElementById('btnSend').disabled = loading;
    document.querySelectorAll('.btn-divine').forEach(b => b.disabled = loading);
}

// 起卦
async function divine(mode) {
    if (isLoading) return;
    
    const question = document.getElementById('inputBox').value.trim();
    
    // 数字模式验证
    if (mode === 'number') {
        const n1 = parseInt(document.getElementById('num1').value);
        const n2 = parseInt(document.getElementById('num2').value);
        if (!n1 || !n2 || n1 <= 0 || n2 <= 0) {
            alert('请输入至少两个正整数');
            return;
        }
    }
    
    // 显示用户消息
    if (question) {
        addMessage('user', question);
    } else {
        const modeNames = { 'random': '随机起卦', 'time': '时间起卦', 'number': '数字起卦' };
        addMessage('user', `[${modeNames[mode]}]`);
    }
    
    setLoading(true);
    document.getElementById('inputBox').value = '';
    
    try {
        const body = {
            mode: mode,
            question: question || '请为我解卦',
            session_id: currentSessionId || ''
        };
        
        if (mode === 'number') {
            body.num1 = parseInt(document.getElementById('num1').value);
            body.num2 = parseInt(document.getElementById('num2').value);
            const n3 = parseInt(document.getElementById('num3').value);
            if (n3 > 0) body.num3 = n3;
        }
        
        const resp = await fetch('/api/divination', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            currentSessionId = data.session_id;
            if (data.gua) showGua(data.gua);
            if (data.reply) addMessage('assistant', data.reply);
            loadSessions();
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
        console.error(e);
    }
    
    setLoading(false);
}

// 六爻起卦
async function divineLiuyao() {
    if (isLoading) return;
    
    const question = document.getElementById('inputBox').value.trim();
    
    if (question) {
        addMessage('user', '【六爻预测】' + question);
    } else {
        addMessage('user', '【六爻预测】铜钱摇卦');
    }
    
    setLoading(true);
    document.getElementById('inputBox').value = '';
    
    try {
        const body = {
            mode: 'random',
            question: question || '请为我断卦',
            session_id: currentSessionId || ''
        };
        
        const resp = await fetch('/api/liuyao', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            currentSessionId = data.session_id;
            if (data.gua) showLiuyaoGua(data.gua);
            if (data.reply) addMessage('assistant', data.reply);
            loadSessions();
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
        console.error(e);
    }
    
    setLoading(false);
}

// 显示六爻卦象
function showLiuyaoGua(gua) {
    const display = document.getElementById('guaDisplay');
    display.classList.add('show');
    
    document.getElementById('guaSymbol').textContent = '☷';
    document.getElementById('guaName').textContent = 
        (gua.ben_gua_name || '') + ' 之 ' + (gua.bian_gua_name || '');
    
    let detail = '';
    detail += `<div>所属宫：<span>${gua.gong_name || '-'}（${gua.gong_wuxing || '-'}）</span></div>`;
    detail += `<div>起卦时间：<span>${gua.gua_time || '-'}</span></div>`;
    detail += `<div>干支：<span>${gua.ganzhi_year || ''}年 ${gua.ganzhi_month || ''}月 ${gua.ganzhi_day || ''}日 ${gua.ganzhi_hour || ''}时</span></div>`;
    
    // 六爻排盘表
    if (gua.yao && gua.yao.length === 6) {
        const posNames = ['上爻','五爻','四爻','三爻','二爻','初爻'];
        detail += `<table class="liuyao-table"><tr><th>爻位</th><th>六亲</th><th>卦</th><th>六神</th><th>世应</th></tr>`;
        for (let i = 5; i >= 0; i--) {
            const y = gua.yao[i];
            const dongMark = y.is_dong ? ' ○' : '';
            const shiYing = y.is_shi ? '<span class="shi-ying">世</span>' : (y.is_ying ? '<span class="shi-ying">应</span>' : '');
            const yy = y.yinyang ? '———' : '— —';
            detail += `<tr class="${y.is_dong ? 'dong-yao' : ''}">`;
            detail += `<td>${posNames[i]}</td>`;
            detail += `<td>${y.liuqin || '-'}</td>`;
            detail += `<td>${y.dizhi || ''} ${y.wuxing || ''} ${yy}${dongMark}</td>`;
            detail += `<td class="liushen-cell">${y.liushen || '-'}</td>`;
            detail += `<td>${shiYing}</td>`;
            detail += `</tr>`;
        }
        detail += `</table>`;
    }
    
    document.getElementById('guaDetail').innerHTML = detail;
}

// 发送追问消息
async function sendMessage() {
    if (isLoading) return;
    
    const input = document.getElementById('inputBox');
    const message = input.value.trim();
    if (!message) return;
    
    if (!currentSessionId) {
        // 如果还没有会话，先起卦
        divine('random');
        return;
    }
    
    addMessage('user', message);
    input.value = '';
    setLoading(true);
    
    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: currentSessionId,
                message: message
            })
        });
        
        const data = await resp.json();
        
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else if (data.reply) {
            addMessage('assistant', data.reply);
        }
    } catch(e) {
        addMessage('assistant', '❌ 网络错误，请稍后重试');
    }
    
    setLoading(false);
}

// 回车发送
function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (currentSessionId) {
            sendMessage();
        } else {
            divine('random');
        }
    }
}

// 自动调整textarea高度
document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// 页面加载
loadSessions();
</script>
